<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>gump</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gump">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.hidden{display:none!important}
#toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:8px;font-size:14px;z-index:1000;display:none;animation:slideIn .3s ease}
#toast.success{background:#238636;color:#fff;display:block}
#toast.error{background:#da3633;color:#fff;display:block}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;position:fixed;top:0;left:0;right:0;z-index:100}
header .logo{font-size:20px;font-weight:700;color:#f0f6fc}
header .header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
header button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
header button:hover{background:#30363d}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #30363d;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100}
.tab-bar-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#8b949e;cursor:pointer;padding:4px 12px;font-size:10px;-webkit-tap-highlight-color:transparent}
.tab-bar-item.active{color:#58a6ff}
.tab-bar-item svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.container{max-width:800px;margin:0 auto;padding:60px 24px 80px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{color:#f0f6fc;margin-bottom:8px}
.card .meta{color:#8b949e;font-size:13px}
input,textarea,select{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;padding:8px 12px;border-radius:6px;width:100%;font-size:14px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:#58a6ff}
textarea{resize:vertical;min-height:80px}
button,.btn{background:#238636;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px}
button:hover,.btn:hover{background:#2ea043}
.btn-danger{background:#da3633}.btn-danger:hover{background:#f85149}
.btn-secondary{background:#21262d;border:1px solid #30363d;color:#c9d1d9}.btn-secondary:hover{background:#30363d}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:4px;font-size:13px;color:#8b949e}
.rating{color:#f0883e;font-weight:600}
.flex{display:flex;gap:12px;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-block;background:#21262d;border:1px solid #30363d;padding:2px 8px;border-radius:12px;font-size:12px;color:#8b949e}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1}
.search-bar select{width:120px}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid #30363d}
.tab{padding:8px 16px;cursor:pointer;color:#8b949e;border-bottom:2px solid transparent}
.tab.active{color:#f0f6fc;border-bottom-color:#58a6ff}
.profile-header{text-align:center;padding:24px 0}
.profile-header h2{color:#f0f6fc;margin-bottom:4px}
.profile-stats{display:flex;gap:24px;justify-content:center;margin-top:12px}
.profile-stats span{font-size:13px;color:#8b949e}
.profile-stats strong{color:#f0f6fc}
.msg-thread{max-height:400px;overflow-y:auto;margin-bottom:12px}
.msg{padding:8px 12px;margin-bottom:8px;border-radius:8px;max-width:70%}
.msg.sent{background:#1f6feb;margin-left:auto;color:#fff}
.msg.received{background:#21262d}
.msg .msg-meta{font-size:11px;color:#8b949e;margin-top:4px}
</style>
</head>
<body>
<div id="toast"></div>
<header>
<span class="logo">gump</span>
<div class="header-right" id="headerRight"></div>
</header>
<div class="container" id="app"></div>
<div class="tab-bar hidden" id="tabBar">
<button class="tab-bar-item" onclick="navigate('feed')" data-tab="feed">
<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
<span>Home</span>
</button>
<button class="tab-bar-item" onclick="navigate('search')" data-tab="search">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<span>Search</span>
</button>
<button class="tab-bar-item" onclick="navigate('messages')" data-tab="messages">
<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
<span>Messages</span>
</button>
<button class="tab-bar-item" onclick="navigate('profile',{id:currentUser?.user_id})" data-tab="profile">
<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
<span>Profile</span>
</button>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('gump_token');
let currentUser = JSON.parse(localStorage.getItem('gump_user') || 'null');

function toast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = type;
    setTimeout(() => t.className = '', 3000);
}

async function api(path, opts = {}) {
    const headers = {'Content-Type': 'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    try {
        const res = await fetch(API + path, {...opts, headers});
        const data = await res.json();
        if (!res.ok) {
            if (res.status === 401 && token) { logout(); return; }
            throw new Error(data.error || 'Request failed');
        }
        return data;
    } catch(e) {
        if (e.message) toast(e.message, 'error');
        throw e;
    }
}

function renderNav() {
    const header = document.getElementById('headerRight');
    const tabBar = document.getElementById('tabBar');
    if (token) {
        header.innerHTML = `<button onclick="logout()">Logout</button>`;
        tabBar.classList.remove('hidden');
    } else {
        header.innerHTML = `
            <button onclick="navigate('login')">Login</button>
            <button onclick="navigate('register')">Register</button>`;
        tabBar.classList.add('hidden');
    }
}

function updateActiveTab(page) {
    const tabMap = {feed:'feed',search:'search',messages:'messages',thread:'messages',profile:'profile'};
    const active = tabMap[page];
    document.querySelectorAll('.tab-bar-item').forEach(item => {
        item.classList.toggle('active', item.dataset.tab === active);
    });
}

function navigate(page, params={}) {
    updateActiveTab(page);
    const app = document.getElementById('app');
    switch(page) {
        case 'login': renderLogin(app); break;
        case 'register': renderRegister(app); break;
        case 'search': renderSearch(app); break;
        case 'feed': renderFeed(app); break;
        case 'profile': renderProfile(app, params.id); break;
        case 'media': renderMedia(app, params.id); break;
        case 'messages': renderMessages(app); break;
        case 'thread': renderThread(app, params.id, params.name); break;
    }
}

function renderLogin(app) {
    app.innerHTML = `
        <div class="card" style="max-width:400px;margin:60px auto">
            <h3>Login</h3>
            <div class="form-group"><label>Email</label><input id="loginEmail" type="email"></div>
            <div class="form-group"><label>Password</label><input id="loginPass" type="password"></div>
            <button onclick="doLogin()">Login</button>
        </div>`;
}

async function doLogin() {
    const data = await api('/auth/login', {method:'POST', body: JSON.stringify({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPass').value
    })});
    token = data.token;
    currentUser = data;
    localStorage.setItem('gump_token', token);
    localStorage.setItem('gump_user', JSON.stringify(data));
    toast('Logged in!');
    renderNav();
    navigate('feed');
}

function renderRegister(app) {
    app.innerHTML = `
        <div class="card" style="max-width:400px;margin:60px auto">
            <h3>Register</h3>
            <div class="form-group"><label>Username</label><input id="regUser"></div>
            <div class="form-group"><label>Email</label><input id="regEmail" type="email"></div>
            <div class="form-group"><label>Password</label><input id="regPass" type="password"></div>
            <button onclick="doRegister()">Register</button>
        </div>`;
}

async function doRegister() {
    const data = await api('/auth/register', {method:'POST', body: JSON.stringify({
        username: document.getElementById('regUser').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPass').value
    })});
    token = data.token;
    currentUser = data;
    localStorage.setItem('gump_token', token);
    localStorage.setItem('gump_user', JSON.stringify(data));
    toast('Account created!');
    renderNav();
    navigate('feed');
}

function logout() {
    token = null; currentUser = null;
    localStorage.removeItem('gump_token');
    localStorage.removeItem('gump_user');
    renderNav();
    navigate('login');
    toast('Logged out');
}

function renderSearch(app) {
    app.innerHTML = `
        <h3 style="margin-bottom:16px">Search Media</h3>
        <div class="search-bar">
            <select id="searchType"><option value="movie">Movie</option><option value="tv">TV Show</option><option value="book">Book</option></select>
            <input id="searchQuery" placeholder="Search...">
            <button onclick="doSearch()">Search</button>
        </div>
        <div id="searchResults"></div>`;
    document.getElementById('searchQuery').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
}

async function doSearch() {
    const type = document.getElementById('searchType').value;
    const q = document.getElementById('searchQuery').value;
    if (!q) return;
    const results = await api(`/media/search?type=${type}&q=${encodeURIComponent(q)}`);
    const div = document.getElementById('searchResults');
    if (!results.length) { div.innerHTML = '<p style="color:#8b949e">No results found</p>'; return; }
    div.innerHTML = results.map(r => {
        const meta = typeof r.metadata === 'string' ? JSON.parse(r.metadata) : r.metadata;
        const poster = meta.image_url || meta.cover_url || meta.poster_path || '';
        const sub = meta.author || meta.release_date || meta.first_air_date || '';
        return `<div class="card flex" style="cursor:pointer" onclick='addMedia(${JSON.stringify(r).replace(/'/g,"&#39;")})'>
            ${poster ? `<img src="${poster}" style="width:60px;border-radius:4px" onerror="this.style.display='none'">` : ''}
            <div><h3>${r.title}</h3><span class="meta">${r.media_type} ${sub ? '· '+sub : ''}</span>
            ${meta.release_date ? `<span class="meta"> · ${meta.release_date}</span>` : ''}</div>
        </div>`;
    }).join('');
}

async function addMedia(r) {
    const media = await api('/media', {method:'POST', body: JSON.stringify({
        media_type: r.media_type, external_id: r.external_id, title: r.title, metadata: r.metadata
    })});
    navigate('media', {id: media.id});
}

async function renderMedia(app, id) {
    const m = await api(`/media/${id}`);
    const meta = typeof m.metadata === 'string' ? JSON.parse(m.metadata) : (m.metadata || {});
    const poster = meta.image_url || meta.cover_url || meta.poster_path || '';
    app.innerHTML = `
        <div class="card">
            <div class="flex">
                ${poster ? `<img src="${poster}" style="width:150px;border-radius:8px" onerror="this.style.display='none'">` : ''}
                <div>
                    <h3>${m.title}</h3>
                    <span class="tag">${m.media_type}</span>
                    ${meta.author ? `<p class="meta" style="margin-top:8px">by ${meta.author}</p>` : ''}
                    ${meta.overview ? `<p class="meta" style="margin-top:8px">${meta.overview.slice(0,200)}...</p>` : ''}
                    ${meta.description ? `<p class="meta" style="margin-top:4px">${meta.description}</p>` : ''}
                </div>
            </div>
        </div>
        ${token ? `
        <div class="card">
            <h3>Your Status</h3>
            <div class="flex" style="margin-top:8px">
                <select id="statusSelect"><option value="want">Want</option><option value="watching">Watching</option><option value="finished">Finished</option><option value="dropped">Dropped</option></select>
                <button onclick="setStatus(${m.id})">Set Status</button>
            </div>
        </div>
        <div class="card">
            <h3>Write a Review</h3>
            <div class="form-group"><label>Rating (0-10)</label><input id="reviewRating" type="number" min="0" max="10" step="0.5"></div>
            <div class="form-group"><label>Review</label><textarea id="reviewBody" placeholder="What did you think?"></textarea></div>
            <button onclick="submitReview(${m.id})">Submit Review</button>
        </div>` : ''}
        <div id="mediaReviews"></div>`;
    // TODO: load existing reviews for this media
}

async function setStatus(mediaId) {
    await api('/status', {method:'POST', body: JSON.stringify({
        media_id: mediaId, status: document.getElementById('statusSelect').value
    })});
    toast('Status updated!');
}

async function submitReview(mediaId) {
    const rating = parseFloat(document.getElementById('reviewRating').value);
    const body = document.getElementById('reviewBody').value;
    await api('/reviews', {method:'POST', body: JSON.stringify({media_id: mediaId, rating: rating || null, body})});
    toast('Review saved!');
}

async function renderFeed(app) {
    app.innerHTML = '<h3 style="margin-bottom:16px">Your Feed</h3><div id="feedItems">Loading...</div>';
    try {
        const items = await api('/feed?limit=30');
        const div = document.getElementById('feedItems');
        if (!items.length) { div.innerHTML = '<p class="meta">Follow some users to see their activity here.</p>'; return; }
        div.innerHTML = items.map(f => `
            <div class="card">
                <div class="flex-between">
                    <span><a href="#" onclick="navigate('profile',{id:${f.user_id}});return false">${f.username}</a>
                    ${f.type === 'review' ? `reviewed` : `set status to <strong>${f.status}</strong> for`}
                    <a href="#" onclick="navigate('media',{id:${f.media_id}});return false">${f.media_title}</a></span>
                    <span class="tag">${f.media_type}</span>
                </div>
                ${f.rating != null ? `<p class="rating" style="margin-top:8px">${f.rating}/10</p>` : ''}
                ${f.body ? `<p style="margin-top:8px">${f.body}</p>` : ''}
                <p class="meta" style="margin-top:8px">${new Date(f.created_at).toLocaleDateString()}</p>
            </div>`).join('');
    } catch(e) {}
}

async function renderProfile(app, id) {
    const p = await api(`/users/${id}`);
    const isMe = currentUser && currentUser.user_id === id;
    app.innerHTML = `
        <div class="profile-header">
            <h2>${p.display_name || p.username}</h2>
            <p class="meta">@${p.username}</p>
            ${p.bio ? `<p style="margin-top:8px">${p.bio}</p>` : ''}
            <div class="profile-stats">
                <span><strong>${p.follower_count}</strong> followers</span>
                <span><strong>${p.following_count}</strong> following</span>
                <span><strong>${p.review_count}</strong> reviews</span>
            </div>
            ${token && !isMe ? `<button style="margin-top:12px" onclick="toggleFollow(${id})">Follow / Unfollow</button>` : ''}
        </div>
        <div class="tabs">
            <div class="tab active" onclick="showProfileTab('reviews',${id})">Reviews</div>
            <div class="tab" onclick="showProfileTab('statuses',${id})">Library</div>
            <div class="tab" onclick="showProfileTab('wall',${id})">Wall</div>
        </div>
        <div id="profileContent">Loading...</div>`;
    showProfileTab('reviews', id);
}

async function showProfileTab(tab, userId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    const div = document.getElementById('profileContent');
    if (tab === 'reviews') {
        const reviews = await api(`/users/${userId}/reviews`);
        div.innerHTML = reviews.length ? reviews.map(r => `
            <div class="card">
                <div class="flex-between">
                    <h3><a href="#" onclick="navigate('media',{id:${r.media_id}});return false">${r.media_title}</a></h3>
                    <span class="rating">${r.rating}/10</span>
                </div>
                <span class="tag">${r.media_type}</span>
                ${r.body ? `<p style="margin-top:8px">${r.body}</p>` : ''}
                <p class="meta" style="margin-top:8px">${new Date(r.created_at).toLocaleDateString()}</p>
            </div>`).join('') : '<p class="meta">No reviews yet</p>';
    } else if (tab === 'statuses') {
        const statuses = await api(`/users/${userId}/status`);
        div.innerHTML = statuses.length ? statuses.map(s => `
            <div class="card flex-between">
                <span><a href="#" onclick="navigate('media',{id:${s.media_id}});return false">${s.media_title}</a> <span class="tag">${s.media_type}</span></span>
                <span class="tag">${s.status}</span>
            </div>`).join('') : '<p class="meta">No items in library</p>';
    } else if (tab === 'wall') {
        const posts = await api(`/wall/${userId}`);
        let html = '';
        if (token) {
            html += `<div class="card">
                <textarea id="wallBody" placeholder="Write on this wall..."></textarea>
                <button style="margin-top:8px" onclick="postWall(${userId})">Post</button>
            </div>`;
        }
        html += posts.length ? posts.map(p => `
            <div class="card">
                <div class="flex-between">
                    <a href="#" onclick="navigate('profile',{id:${p.author_id}});return false">${p.author_name}</a>
                    <span class="meta">${new Date(p.created_at).toLocaleDateString()}</span>
                </div>
                <p style="margin-top:8px">${p.body}</p>
            </div>`).join('') : '<p class="meta">No wall posts yet</p>';
        div.innerHTML = html;
    }
}

async function toggleFollow(id) {
    try {
        await api(`/follow/${id}`, {method:'POST'});
        toast('Followed!');
    } catch(e) {
        try {
            await api(`/follow/${id}`, {method:'DELETE'});
            toast('Unfollowed');
        } catch(e2) {}
    }
    renderProfile(document.getElementById('app'), id);
}

async function postWall(userId) {
    const body = document.getElementById('wallBody').value;
    if (!body) return;
    await api(`/wall/${userId}`, {method:'POST', body: JSON.stringify({body})});
    toast('Posted!');
    showProfileTab('wall', userId);
}

async function renderMessages(app) {
    app.innerHTML = '<h3 style="margin-bottom:16px">Messages</h3><div class="card"><div class="flex"><input id="newMsgUser" placeholder="User ID"><button onclick="startThread()">New Message</button></div></div><div id="convos">Loading...</div>';
    const convos = await api('/messages');
    document.getElementById('convos').innerHTML = convos.length ? convos.map(c => `
        <div class="card" style="cursor:pointer" onclick="navigate('thread',{id:${c.user_id},name:'${c.username}'})">
            <div class="flex-between">
                <strong>${c.display_name || c.username}</strong>
                ${c.unread_count ? `<span class="tag" style="background:#238636;color:#fff">${c.unread_count} new</span>` : ''}
            </div>
            <p class="meta" style="margin-top:4px">${c.last_message.slice(0,60)}${c.last_message.length>60?'...':''}</p>
        </div>`).join('') : '<p class="meta">No conversations yet</p>';
}

function startThread() {
    const id = parseInt(document.getElementById('newMsgUser').value);
    if (id) navigate('thread', {id, name: 'User '+id});
}

async function renderThread(app, userId, name) {
    app.innerHTML = `
        <div class="flex-between" style="margin-bottom:16px">
            <h3>${name}</h3>
            <button class="btn-secondary" onclick="navigate('messages')">Back</button>
        </div>
        <div class="msg-thread" id="msgThread">Loading...</div>
        <div class="flex"><input id="msgBody" placeholder="Type a message..." style="flex:1"><button onclick="sendMsg(${userId})">Send</button></div>`;
    document.getElementById('msgBody').addEventListener('keydown', e => { if(e.key==='Enter') sendMsg(userId); });
    const msgs = await api(`/messages/${userId}`);
    const div = document.getElementById('msgThread');
    div.innerHTML = msgs.map(m => `
        <div class="msg ${m.sender_id === currentUser.user_id ? 'sent' : 'received'}">
            <p>${m.body}</p>
            <div class="msg-meta">${new Date(m.created_at).toLocaleTimeString()}</div>
        </div>`).join('');
    div.scrollTop = div.scrollHeight;
}

async function sendMsg(userId) {
    const input = document.getElementById('msgBody');
    if (!input.value) return;
    await api('/messages', {method:'POST', body: JSON.stringify({receiver_id: userId, body: input.value})});
    input.value = '';
    renderThread(document.getElementById('app'), userId, '');
}

// Register service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}

// Init
renderNav();
navigate(token ? 'feed' : 'login');
</script>
</body>
</html>
